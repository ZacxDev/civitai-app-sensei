name: CI

on:
  push:
    # 🔴 `trunk`, NOT `main` — this repo's default branch is `trunk`, and a
    # `branches:` filter naming a branch that does not exist matches nothing.
    # It is silent: there is no warning, no skipped run, no red X. The trigger
    # simply never fires, and the workflow LOOKS healthy because every PR run
    # comes from `pull_request:` below.
    #
    # Measured 2026-08-27, before this fix: `gh run list --branch trunk`
    # returned ZERO runs over the repo's entire history, while the unfiltered
    # listing showed only `pull_request` events. Not one `push` run had ever
    # happened. So nothing verified the merged result of a squash — only the
    # branch as it looked before merging, which is a different tree.
    branches: [trunk]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 🔒 LOCKSTEP: `src/toolchain-lockstep.test.ts` requires this to equal
          # the `pnpmMajor` pinned in flake.nix, so a local shell and CI cannot
          # run different pnpm majors. Change both, or neither.
          version: 11

      - uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the single authority for the node major — flake.nix
          # reads the same file. Never restate the version here.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
