# 🔴 THE `minimumReleaseAgeExclude` BLOCK IS BACK, WITH ONE LIVE ENTRY, AND IT IS
# LOAD-BEARING RIGHT NOW. `@civitai/blocks-react@0.62.0` was published
# 2026-10-02T04:00:25Z, so it sits inside pnpm 11's built-in ~24h
# `minimumReleaseAge` cutoff until roughly 2026-10-03T04:00Z. Measured in BOTH
# directions on 2026-10-02, which is the only reason this paragraph is trusted:
# with the entry removed, `pnpm install --frozen-lockfile` FAILS —
#
#   ✗ Lockfile failed supply-chain policy check (203 entries)
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] 1 lockfile entries failed verification:
#     @civitai/blocks-react@0.62.0 was published at 2026-10-02T04:00:25.000Z,
#     within the minimumReleaseAge cutoff (2026-10-01T04:54:39.418Z)
#
# — and with it restored the same command exits 0 (`Already up to date`).
# `.github/workflows/ci.yml` line 40 runs exactly that command, so dropping this
# entry today fails CI outright.
#
# ⚠️ `pnpm config get minimumReleaseAge` returns `undefined` HERE AND THAT DOES NOT
# MEAN UNSET-AND-INERT — it means pnpm applies its built-in 24h default. Reading
# that `undefined` as "no policy, so the list does nothing" is the specific wrong
# turn to avoid; the control above is what settles it, not the config read.
#
# The three entries this file used to carry — `@civitai/app-sdk@0.45.0`,
# `@civitai/blocks-react@0.53.1`, `@civitai/sdk@0.8.0` — have all aged out and are
# gone, correctly. Re-measure a publish time with `npm view <pkg> time --json`,
# which is the only authority on one; do not trust a timestamp written into a
# comment, including these.
#
# THE RULE, unchanged: pin the version EXACTLY, never a bare package name, or every
# future release of that package is exempted including one cut by a compromised
# token. Keep an entry only for as long as that version sits inside the cutoff, and
# delete it again after — a bump that moves `package.json` off a version expires
# that version's entry, so replace it rather than letting the list accrete a line
# per bump.
#
# 🔴 WHY IT HAS TO BE COMMITTED WHILE IT MATTERS, because this is the half that is
# easy to get wrong: a bare `pnpm install` SUCCEEDS and silently writes this file
# for you, without a `packages` key. `pnpm install --frozen-lockfile` — which
# `.github/workflows/ci.yml` runs, and which any reproducible build uses — FAILS
# with `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` until the exclusion is in the tree.
# So a pin and its exclusion land in ONE commit, or a reviewer's checkout does not
# install. (Confirmed on the 0.62.0 bump: a bare `pnpm install` appended the entry
# below on its own, printing `Added 1 entry to minimumReleaseAgeExclude` in among
# the dependency table. That line is easy to scroll past, and the commit it belongs
# to is the one you are writing — stage this file.)

# The `packages` key is the other half, and 🔴 ON NO ESTABLISHED RATIONALE. Two were
# written for it and BOTH were refuted by measurement. They are recorded here so
# nobody reaches for a third; the reaching is what produced the first two.
#
#   DEAD DRAFT 1: "actions/setup-node's `cache: pnpm` errors without it."
#   FALSE — that step runs `pnpm store path --silent`, rc=0 on pnpm 10 and 11.
#
#   DEAD DRAFT 2: "the platform builder runs `corepack enable` UNPINNED on
#   node:22-alpine, so pnpm 9 is in reach." FALSE — measured in that image
#   with a paired control: unpinned corepack resolves FORWARD to pnpm 12.5.1,
#   not back to 9, and pnpm 12 does NOT error. (`corepack prepare pnpm@9.15.9`
#   in the same container on the same fixture DOES error, so the fixture is
#   sound — the builder simply never reaches the major that fails.)
#
# What is measured: pnpm 9.15.9 rejects a `packages`-less file; 10.34.5, 11.27.0
# and 12.5.1 accept it. CI pins pnpm 11. So no environment this repo is known to
# ship through resolves the only major that cares. The key is kept because it is
# one line and harmless, NOT because a reachable hazard was demonstrated —
# deleting this file outright is a defensible call on the same evidence.
#
# ⚠️ `civitai-app-gen-matrix` and `civitai-app-playable-collections` both name
# pnpm ITSELF alongside setup-node, which is the correct axis — do not "correct"
# them on THAT point. (An earlier version of this comment claimed they blamed
# setup-node alone; that was a misreading.) Their own unqualified "pnpm errors"
# is still major-dependent, and both pin pnpm 11 in their CI, so the
# major discriminator above is worth propagating to them.
#
# Guarded by `src/toolchain-lockstep.test.ts`, which fails if this file exists
# without a non-empty `packages`. Read that guard's own comment before trusting
# this one — it carries the same two dead drafts.
packages:
  - '.'
minimumReleaseAgeExclude:
  - '@civitai/blocks-react@0.62.0'
