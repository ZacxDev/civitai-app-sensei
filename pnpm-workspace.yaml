# 🔴 THIS FILE IS TEMPORARY AND SHOULD BE DELETED. Its only load-bearing content
# is the age exclusion below, which stops mattering once both versions are older
# than pnpm's ~24h `minimumReleaseAge` cutoff:
#
#   @civitai/app-sdk@0.45.0      published 2026-09-19T19:03:44Z  → free 2026-09-20T19:03Z
#   @civitai/blocks-react@0.53.1 published 2026-09-20T02:20:25Z  → free 2026-09-21T02:20Z
#
# After 2026-09-21T02:20Z this whole file can be removed and `pnpm install
# --frozen-lockfile` still passes. Delete it then rather than letting it accrete
# a line per bump.

# Required while the file exists at all. 🔴 The reason is the PLATFORM BUILDER,
# not CI. The discriminator is the pnpm MAJOR, not the command: pnpm 9 fails
# `packages field missing or empty` on `pnpm install` against a `packages`-less
# workspace file, while pnpm 10 and 11 accept it. Measured across three majors
# (9.15.9 errors; 10.34.5 and 11.27.0 do not), with a control: the same pnpm 9
# with NO workspace file at all is rc=0, which is why deleting this file later
# is safe. CI pins pnpm 11 via `pnpm/action-setup`, so CI is fine either way.
# The platform builder is not — per CLAUDE.md's third-environment table it runs
# `corepack enable` UNPINNED on `node:22-alpine`, so pnpm 9 is in reach, and
# `civitai app submit` bundles this file with the tree. Under pnpm 9 its
# absence breaks the build of the LIVE app while every signal this repo
# produces stays green.
#
# ⚠️ `civitai-app-gen-matrix` and `civitai-app-playable-collections` already
# state this correctly — both name pnpm ITSELF alongside setup-node. Do not
# "correct" them. An earlier version of this comment claimed they blamed
# setup-node alone and told the reader to fix them; that was a misreading of
# both files.
#
# Guarded: `src/toolchain-lockstep.test.ts` fails if this file exists without a
# non-empty `packages`. That guard is the point — the NEXT pin bump's bare
# `pnpm install` auto-writes this file WITHOUT the key.
packages:
  - '.'

# pnpm's `minimumReleaseAge` policy (~24h) rejects very fresh versions.
# 🔴 The two install paths behave DIFFERENTLY and only one of them is CI's:
#   - bare `pnpm install`        → succeeds, and silently WRITES this file's
#                                  exclusion block for you (without `packages`).
#   - `pnpm install --frozen-lockfile` → FAILS with
#     ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION until the exclusion is committed.
# `.github/workflows/ci.yml` uses `--frozen-lockfile`, so the exclusion has to
# be in the tree. (CLAUDE.md's "the install fails" is correct for that path.)
#
# Both entries are Civitai first-party packages already pinned in package.json,
# at exactly the versions the lockfile resolved to — nothing here loosens what
# the app builds against:
#   - @civitai/app-sdk@0.45.0      — the block message/type contract. This is the
#     FIRST version carrying `BLOCK_MESSAGE_REJECTED`, the block→host report that
#     makes a dropped reply visible to the host instead of silent. 0.42.0/0.43.0/
#     0.44.0 each contain zero occurrences of it. 🔴 Deliberately NOT 0.46.0:
#     nothing requires it, it is a breaking release (a type-only rename on the
#     ORCHESTRATOR surface, which this app does not import), and it also carries
#     a runtime change in `dist/cookies/` this app cannot reach. Taking the
#     minimum version that satisfies the requirement is the point.
#   - @civitai/blocks-react@0.53.1 — the hooks + `IframeTransport`. **0.53.0 is
#     the version that matters**: it adds the emit at the validator drop site.
#     0.53.1 is a single-hook patch (`useBlockResize` only, plus package.json
#     and README) fixing that hook to observe a root mounting on a LATER render.
#     🔴 That fix is INERT for this app, and an earlier version of this comment
#     wrongly claimed it was "this app's shape". It is not: `src/App.tsx` has
#     three top-level returns (lines 2798, 2809, 2820) and ALL THREE render
#     `<div ref={rootRef}>`, so the root exists on the first commit and 0.53.0's
#     effect already observed it. The app is ALREADY applying the workaround
#     0.53.1's release note says is no longer needed. Do not read this pin as a
#     licence to drop the ref from any branch of that conditional — that would
#     re-introduce the very bug 0.53.1 fixes for blocks that do drop it.
#     We take `.1` because it is strictly newer and free, not because we need
#     it. Its peer floor is `@civitai/app-sdk >=0.45.0 <1.0.0`, which `^0.45.0`
#     satisfies.
#
# @civitai/components-react and @civitai/theme are NOT listed and did NOT move:
# blocks-react@0.53.1 exact-pins theme 0.3.1 + components 0.4.1, and
# components-react@0.4.1 pins the same two, so the four are already the
# canonical pairing. `src/civitai-dependency-lockstep.test.ts` is what proves
# that mechanically; this comment does not.
minimumReleaseAgeExclude:
  - '@civitai/app-sdk@0.45.0'
  - '@civitai/blocks-react@0.53.1'
