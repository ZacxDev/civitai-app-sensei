# 🔴 THE `minimumReleaseAgeExclude` BLOCK HAS FOUR LIVE ENTRIES AND EVERY ONE OF
# THEM IS LOAD-BEARING RIGHT NOW, until roughly 2026-10-03T17:38Z. The
# blocks-react ^0.63.0 / app-sdk ^0.55.0 bump put them there. Publish instants, as
# named by pnpm's OWN refusal (which is the figure the gate compares against):
#
#   @civitai/blocks-react@0.63.0   2026-10-02T17:38:43.000Z   direct
#   @civitai/app-sdk@0.55.0        2026-10-02T17:38:42.000Z   direct
#   @civitai/components@0.9.1      2026-10-02T17:38:43.000Z   🔴 TRANSITIVE
#   @civitai/theme@0.5.0           2026-10-02T17:38:43.000Z   direct (bumped here)
#
# 🔴 FOUR TOKENS FOR TWO EDITED RANGES, BECAUSE THE GATE SCORES EVERY LOCKFILE
# ENTRY AND NOT ONLY THE RANGES YOU TOUCHED. `@civitai/components` is not a direct
# dependency of this app at all — `package.json` pins `@civitai/components-react`,
# a DIFFERENT package — and 0.9.1 enters the lockfile only underneath
# `blocks-react@0.63.0`. So counting your own `package.json` edits is not a way to
# predict how many tokens you need. pnpm appended `components@0.9.1` and
# `theme@0.5.0` ITSELF during a bare `pnpm install`, printing `Added 2 entries to
# minimumReleaseAgeExclude` in among the dependency table — read what it wrote
# rather than assuming your own two sufficed.
#
# MEASURED BOTH WAYS, PER TOKEN, which is the only reason this paragraph is
# trusted: each of the four was deleted on its own from a CLEAN tree and
# `pnpm install --frozen-lockfile` exited 1 naming exactly that package, e.g.
#
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] 1 lockfile entries failed verification:
#     @civitai/components@0.9.1 was published at 2026-10-02T17:38:43.000Z,
#     within the minimumReleaseAge cutoff (2026-10-01T19:20:48.392Z)
#
# — with all four present the same command exits 0 over 205 entries.
# 🔴 `rm -rf node_modules` BEFORE EACH ARM OR THE CONTROL IS WORTHLESS: against a
# warm tree the command short-circuits to `Already up to date` and returns 0
# whether or not the exclusion is there. `.github/workflows/ci.yml` line 40 runs
# exactly this command against a cold cache, so a warm local 0 is not CI's answer.
#
# ⚠️ `pnpm config get minimumReleaseAge` returns `undefined` HERE AND THAT DOES NOT
# MEAN UNSET-AND-INERT — it means pnpm applies its built-in 24h default. Reading
# that `undefined` as "no policy, so the list does nothing" is the specific wrong
# turn to avoid; the control above is what settles it, not the config read. This
# paragraph was re-verified on the ^0.63.0 bump and is CORRECT as written — an
# earlier revision of this file deleted the whole block under a header asserting it
# was inert, and CI failed. Leave it.
#
# 🔴 THE REPLACE CONVENTION HAS AN ORDERING TRAP, FOUND ON THIS BUMP. Replacing
# `@civitai/blocks-react@0.62.0` with `@civitai/blocks-react@0.63.0` and THEN
# installing fails: at gate time the lockfile still resolves 0.62.0, which now has
# no exclusion, so the install is refused before it can write the new lockfile —
# and the error names 0.62.0, i.e. the version you just removed on purpose, which
# reads as nonsense. Allow BOTH for the resolving install
# (`'@civitai/blocks-react@0.62.0 || 0.63.0'`), then delete the old alternative
# once the lockfile no longer mentions it (`grep -c blocks-react@0.62.0` → 0) and
# re-run the clean frozen install to confirm. The committed state is the pruned
# one, per the rule below.
#
# Entries this file carried before and no longer does — `@civitai/app-sdk@0.45.0`,
# `@civitai/blocks-react@0.53.1`, `@civitai/blocks-react@0.62.0`,
# `@civitai/sdk@0.8.0` — have all aged out or been bumped past, correctly.
# Re-measure a publish time with `npm view <pkg> time --json`, which is the only
# authority on one; do not trust a timestamp written into a comment, including
# these. ⚠️ `npm view` and pnpm disagree by minutes on the same version (npm says
# 17:42:54.561Z for blocks-react@0.63.0 against pnpm's 17:38:43.000Z) — two
# registry fields, not a transcription error. Quote pnpm's, because pnpm is what
# fails.
#
# THE RULE, unchanged: pin the version EXACTLY, never a bare package name, or every
# future release of that package is exempted including one cut by a compromised
# token. Keep an entry only for as long as that version sits inside the cutoff, and
# delete it again after — a bump that moves `package.json` off a version expires
# that version's entry, so replace it rather than letting the list accrete a line
# per bump.
#
# 🔴 WHY IT HAS TO BE COMMITTED WHILE IT MATTERS, because this is the half that is
# easy to get wrong: a bare `pnpm install` SUCCEEDS and silently writes this file
# for you, without a `packages` key. `pnpm install --frozen-lockfile` — which
# `.github/workflows/ci.yml` runs, and which any reproducible build uses — FAILS
# with `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` until the exclusion is in the tree.
# So a pin and its exclusion land in ONE commit, or a reviewer's checkout does not
# install. (Confirmed on the 0.62.0 bump: a bare `pnpm install` appended the entry
# below on its own, printing `Added 1 entry to minimumReleaseAgeExclude` in among
# the dependency table. That line is easy to scroll past, and the commit it belongs
# to is the one you are writing — stage this file.)

# The `packages` key is the other half, and 🔴 ON NO ESTABLISHED RATIONALE. Two were
# written for it and BOTH were refuted by measurement. They are recorded here so
# nobody reaches for a third; the reaching is what produced the first two.
#
#   DEAD DRAFT 1: "actions/setup-node's `cache: pnpm` errors without it."
#   FALSE — that step runs `pnpm store path --silent`, rc=0 on pnpm 10 and 11.
#
#   DEAD DRAFT 2: "the platform builder runs `corepack enable` UNPINNED on
#   node:22-alpine, so pnpm 9 is in reach." FALSE — measured in that image
#   with a paired control: unpinned corepack resolves FORWARD to pnpm 12.5.1,
#   not back to 9, and pnpm 12 does NOT error. (`corepack prepare pnpm@9.15.9`
#   in the same container on the same fixture DOES error, so the fixture is
#   sound — the builder simply never reaches the major that fails.)
#
# What is measured: pnpm 9.15.9 rejects a `packages`-less file; 10.34.5, 11.27.0
# and 12.5.1 accept it. CI pins pnpm 11. So no environment this repo is known to
# ship through resolves the only major that cares. The key is kept because it is
# one line and harmless, NOT because a reachable hazard was demonstrated —
# deleting this file outright is a defensible call on the same evidence.
#
# ⚠️ `civitai-app-gen-matrix` and `civitai-app-playable-collections` both name
# pnpm ITSELF alongside setup-node, which is the correct axis — do not "correct"
# them on THAT point. (An earlier version of this comment claimed they blamed
# setup-node alone; that was a misreading.) Their own unqualified "pnpm errors"
# is still major-dependent, and both pin pnpm 11 in their CI, so the
# major discriminator above is worth propagating to them.
#
# Guarded by `src/toolchain-lockstep.test.ts`, which fails if this file exists
# without a non-empty `packages`. Read that guard's own comment before trusting
# this one — it carries the same two dead drafts.
packages:
  - '.'
minimumReleaseAgeExclude:
  - '@civitai/blocks-react@0.63.0'
  - '@civitai/components@0.9.1'
  - '@civitai/theme@0.5.0'
  - '@civitai/app-sdk@0.55.0'
