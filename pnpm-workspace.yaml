# 🔴 THE `minimumReleaseAgeExclude` BLOCK IS GONE, AND THAT IS WHY THIS FILE IS
# NEARLY EMPTY. It carried three entries — `@civitai/app-sdk@0.45.0`,
# `@civitai/blocks-react@0.53.1`, `@civitai/sdk@0.8.0` — to get past pnpm's ~24h
# `minimumReleaseAge` policy while each was fresh. All three have aged out
# (re-measured with `npm view <pkg> time --json`, which is the only authority on a
# publish time — do not trust a timestamp written into a comment, including these):
#
#   @civitai/app-sdk@0.45.0      published 2026-09-19T19:03:44Z  → free 2026-09-20T19:03Z
#   @civitai/blocks-react@0.53.1 published 2026-09-20T02:20:25Z  → free 2026-09-21T02:20Z
#   @civitai/sdk@0.8.0           published 2026-09-27T02:04:53Z  → free 2026-09-28T02:04:53Z
#
# so the block was INERT and `pnpm install --frozen-lockfile` passes without it.
# Deleted rather than left to accrete a line per bump; re-add an exclusion — with
# the version pinned EXACTLY, never a bare package name, or every future release of
# that package is exempted including one cut by a compromised token — only for as
# long as a newly published version sits inside the cutoff, and delete it again
# after.
#
# 🔴 WHY IT HAS TO BE COMMITTED WHILE IT MATTERS, because this is the half that is
# easy to get wrong: a bare `pnpm install` SUCCEEDS and silently writes this file
# for you, without a `packages` key. `pnpm install --frozen-lockfile` — which
# `.github/workflows/ci.yml` runs, and which any reproducible build uses — FAILS
# with `ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION` until the exclusion is in the tree.
# So a pin and its exclusion land in ONE commit, or a reviewer's checkout does not
# install.

# The `packages` key is what remains, and 🔴 ON NO ESTABLISHED RATIONALE. Two were
# written for it and BOTH were refuted by measurement. They are recorded here so
# nobody reaches for a third; the reaching is what produced the first two.
#
#   DEAD DRAFT 1: "actions/setup-node's `cache: pnpm` errors without it."
#   FALSE — that step runs `pnpm store path --silent`, rc=0 on pnpm 10 and 11.
#
#   DEAD DRAFT 2: "the platform builder runs `corepack enable` UNPINNED on
#   node:22-alpine, so pnpm 9 is in reach." FALSE — measured in that image
#   with a paired control: unpinned corepack resolves FORWARD to pnpm 12.5.1,
#   not back to 9, and pnpm 12 does NOT error. (`corepack prepare pnpm@9.15.9`
#   in the same container on the same fixture DOES error, so the fixture is
#   sound — the builder simply never reaches the major that fails.)
#
# What is measured: pnpm 9.15.9 rejects a `packages`-less file; 10.34.5, 11.27.0
# and 12.5.1 accept it. CI pins pnpm 11. So no environment this repo is known to
# ship through resolves the only major that cares. The key is kept because it is
# one line and harmless, NOT because a reachable hazard was demonstrated —
# deleting this file outright is a defensible call on the same evidence.
#
# ⚠️ `civitai-app-gen-matrix` and `civitai-app-playable-collections` both name
# pnpm ITSELF alongside setup-node, which is the correct axis — do not "correct"
# them on THAT point. (An earlier version of this comment claimed they blamed
# setup-node alone; that was a misreading.) Their own unqualified "pnpm errors"
# is still major-dependent, and both pin pnpm 11 in their CI, so the
# major discriminator above is worth propagating to them.
#
# Guarded by `src/toolchain-lockstep.test.ts`, which fails if this file exists
# without a non-empty `packages`. Read that guard's own comment before trusting
# this one — it carries the same two dead drafts.
packages:
  - '.'
